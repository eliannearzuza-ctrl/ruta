<!doctype html>
<html lang="es" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Outfit:wght@400;500;600;700;800&display=swap">
<title>Libera Tu Tiempo descubre tu Ruta IA</title>
<meta name="description" content="Toca el reloj de arena y descubre tu ruta con IA.">
<meta property="og:type" content="website">
<meta property="og:title" content="Lead Large · Descubre tu ruta con IA">
<meta property="og:description" content="Toca el reloj de arena y descubre tu ruta con IA.">
<meta property="og:url" content="https://descubre.leadlargehub.com/">
<meta property="og:image" content="https://descubre.leadlargehub.com/cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://descubre.leadlargehub.com/cover.jpg">
<style>
:root{
  --bg:#F8F7F3; --panel:#F8F7F3; --fg:#111111; --muted:#666960;
  --accent:#687D62; --line:#E5E4DF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--fg);
  font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
}
body{padding:24px 16px 40px;display:flex;justify-content:center}
main{width:100%;max-width:520px;display:flex;flex-direction:column}
h1,h2{margin:0;font-family:Outfit,system-ui,sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.1}
h1{font-size:clamp(1.9rem,8vw,2.4rem)}
h2{font-size:clamp(1.5rem,6vw,1.9rem)}
p{margin:0;line-height:1.55;color:var(--muted)}
.screen{display:flex;flex-direction:column;gap:18px;animation:in .35s ease}
.screen[hidden]{display:none}
.screen.fill{min-height:calc(100dvh - 48px);padding-top:12px}
html.light,html.light body{background:#FBF9F5;background-attachment:scroll;--fg:#111111;--muted:#666960}
#s0.cover{gap:0;padding:0;min-height:0}
.cover-art{position:relative;margin:0 -16px;width:calc(100% + 32px);container-type:inline-size}
.cover-title{position:absolute;left:55%;top:36.4%;margin:0;font-family:Newsreader,"Source Serif 4",Georgia,serif;font-optical-sizing:auto;font-weight:500;font-size:9.4cqw;line-height:1.16;letter-spacing:-.015em;color:#111111;white-space:nowrap}
.cover-title .sage{color:#687D62}
.cover-sub2{position:absolute;left:55.4%;top:52.2%;margin:0;font-family:Outfit,system-ui,sans-serif;font-size:3.3cqw;font-weight:500;color:#111111;white-space:nowrap}
.cover-btn-label{position:absolute;left:51.1%;top:55.5%;width:40.8%;height:5%;display:flex;align-items:center;justify-content:center;font-family:Newsreader,"Source Serif 4",Georgia,serif;font-size:4cqw;color:#FFFFFF;pointer-events:none;white-space:nowrap}
.cover-art img{display:block;width:100%;height:auto}
.cover-clean{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:88vh;margin:0 -16px;padding:32px 16px;box-sizing:border-box;text-align:center;font-family:Outfit,system-ui,sans-serif;background:#0B0C0B}
.cover-box{width:100%;max-width:340px;box-sizing:border-box;padding:48px 24px;border:1px solid rgba(95,122,92,.7);border-radius:28px;background:transparent}
.cover-big{margin:0;font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em;color:#FFFFFF}
.cover-big span{color:#8FA88A}
.cover-big .cover-word{cursor:pointer}
.cover-hint{margin:0;font-size:15px;font-weight:500;color:#9A9F9A}
.cover-cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;box-sizing:border-box;height:64px;padding:0;border:0;border-radius:999px;background:#5F7A5C;color:#FFFFFF;box-shadow:0 12px 28px rgba(95,122,92,.3);font:600 20px/1.2 Outfit,system-ui,sans-serif;cursor:pointer}
.cover-cta:focus-visible{outline:2px solid #5F7A5C;outline-offset:3px}
.cover-lead{margin:24px 0 0;font-size:12px;font-weight:600;letter-spacing:.3em;color:#A3A8A3}
.cover-clean .cover-rule{position:static;display:block;width:44px;height:3px;transform:none;margin-top:-6px;border-radius:3px;background:#4D6F9F;pointer-events:none}
.cover-clean .cover-lead{position:static;transform:none;top:auto;left:auto;margin:0}
.cover-hit{position:absolute;left:17%;top:17%;width:66%;height:66%;margin:0;padding:0;border:0;border-radius:16px;background:transparent;cursor:pointer}
.cover-hit:focus-visible{outline:2px solid #687D62;outline-offset:3px}
.cover-rule{position:absolute;left:46.3%;top:95%;width:7.6%;height:4px;transform:translateY(-50%);background:#4D6F9F;border-radius:3px;pointer-events:none}
.cover-lead{position:absolute;left:50%;top:91.4%;transform:translate(-50%,-50%);font-family:Outfit,system-ui,sans-serif;font-size:1.9cqw;font-weight:500;letter-spacing:.28em;color:#A3A8A3;white-space:nowrap;pointer-events:none}
.cover-btn-label{position:absolute;left:23.3%;top:62.6%;width:53.6%;height:9.2%;display:flex;align-items:center;justify-content:center;font-family:Outfit,system-ui,sans-serif;font-size:3.6cqw;font-weight:600;color:#DDE2DD;pointer-events:none;white-space:nowrap}
.cover-hit:focus-visible{outline:2px solid #687D62;outline-offset:3px}
.cover-pulse{position:absolute;left:50%;top:50.4%;width:90%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(95,122,92,.6);pointer-events:none;animation:cover-pulse 2.4s ease-out infinite}
@keyframes cover-pulse{0%{transform:translate(-50%,-50%) scale(.96);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.08);opacity:0}}
@media (prefers-reduced-motion:reduce){.cover-pulse{animation:none;opacity:.6}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#s0{gap:16px;padding-top:8px}
.cover-h1{font-family:Outfit,system-ui,sans-serif;font-size:clamp(2.6rem,13vw,4.2rem);font-weight:700;line-height:.95;letter-spacing:-.03em;color:var(--fg);margin-top:20px}
.cover-h1 .sage{color:var(--accent)}
.cover-sub{font-size:1.15rem;font-weight:600;line-height:1.4;color:var(--fg)}
.cover-muted{font-size:1rem;color:var(--muted)}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:18px 20px;border:0;border-radius:16px;background:var(--accent);color:#FFFFFF;font:inherit;font-size:1.15rem;font-weight:700;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(104,125,98,.25)}
.art-slot{width:100%;aspect-ratio:1/1;max-height:380px;margin-top:8px}
#sq h2{margin-top:28px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead-mark{margin-top:auto;padding-top:24px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;color:var(--fg)}
.rule{display:block;width:56px;height:3px;border-radius:3px;background:var(--accent)}
.card{
  display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;
  padding:18px 20px;border-radius:18px;border:1px solid var(--line);
  background:#FFFFFF;
  color:var(--fg);font:inherit;cursor:pointer;
  transition:transform .2s ease,border-color .2s ease,background .2s ease;
}
.card:hover,.card:focus-visible,.card[aria-pressed="true"]{transform:translateY(-2px);border-color:var(--accent);background:rgba(104,125,98,.10);outline:none}
.card strong{font-size:1.05rem;line-height:1.35}
.card span{font-size:.92rem;color:var(--muted);line-height:1.45}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:16px 22px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:1rem;
  background:var(--accent);color:#FFFFFF;text-decoration:none;cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(104,125,98,.25)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.block{width:100%}
.panel{
  padding:22px;border-radius:20px;display:flex;flex-direction:column;gap:14px;
  border:1px solid var(--line);background:#FFFFFF;
}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.bar{display:flex;align-items:center;gap:12px}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>

  <!-- PORTADA: imagen aprobada; el botón invisible sobre "Descubrir mi ruta" inicia el simulador -->
  <section id="s0" class="screen cover">
    <h1 class="sr-only">Libera tu tiempo.</h1>
    <div class="cover-art">
      
      
      <img src="cover.jpg" alt="Libera tu tiempo. Toca el reloj de arena para descubrir tu ruta con IA." />
      <span class="cover-pulse" aria-hidden="true"></span>
      <button class="cover-hit" id="start" type="button" aria-label="Toca el reloj de arena: ir a las preguntas"></button>
      
      
    </div>
  </section>

  <!-- PREGUNTAS -->
  <section id="sq" class="screen fill" hidden>
    <div class="bar">
      <button class="btn ghost" id="back" type="button" style="padding:10px 14px">← Atrás</button>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    </div>
    <h2 id="qtitle"></h2>
    <div id="qopts" class="stack"></div>
  </section>

  <!-- RESULTADO -->
  <section id="sr" class="screen" hidden>
    <div class="panel">
      <p class="eyebrow">Tu resultado</p>
      <p style="color:var(--fg);font-size:1.15rem;line-height:1.3"><strong style="color:var(--accent)">¡Identificado!</strong> <span id="rprofile" style="font-weight:700;color:var(--fg)"></span></p>
      <span class="rule" aria-hidden="true"></span>
      <h2 id="rtitle"></h2>
      <p id="rdesc"></p>
    </div>

    <div class="panel">
      <p id="ititle" style="color:var(--fg);font-weight:700"></p>
      <div class="stack">
        <button class="card" type="button" data-i="si" aria-pressed="false"><strong>Sí, quiero aprender a construirlo</strong></button>
        <button class="card" type="button" data-i="no" aria-pressed="false"><strong>No, solo busco algo que ya funcione</strong></button>
      </div>
    </div>

    <div class="panel">
      <p style="color:var(--fg);font-weight:700">Guarda tu resultado para consultarlo cuando quieras</p>
      <p>Déjanos tu correo si quieres recibirlo.</p>
      <a class="btn block" id="save" href="#" target="_blank" rel="noopener">Guardar Resultado</a>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost" id="change" type="button">Cambiar mis respuestas</button>
      <button class="btn ghost" id="again" type="button">Reiniciar</button>
    </div>
  </section>

</main>

<script>
/* Enlace del formulario de Tally: aquí se captura el correo. */
const TALLY_URL = "https://tally.so/r/vXjM78";

/* Contenido tal cual lo indicó la especificación. */
const QUESTIONS = [
  {
    id: "q1",
    text: "¿Cuál es el cuello de botella o problema real hoy?",
    options: [
      { v: "1", title: "El trabajo operativo me quita tiempo", sub: "Hacer tareas sueltas una por una: redactar correos, resumir reportes, crear textos." },
      { v: "2", title: "El desorden está en la operación", sub: "Mover datos de un lado a otro manualmente, conectar herramientas o seguir pasos repetitivos." },
      { v: "3", title: "La complejidad me frena", sub: "Tener que analizar situaciones que cambian constantemente, atender clientes con casos imprevistos o tomar decisiones complejas." },
      { v: "4", title: "No tengo claridad", sub: "Sé que tengo problemas de tiempo, pero no logro identificar por dónde empezar." }
    ]
  },
  {
    id: "q2",
    text: "Para resolver este problema, ¿qué nivel de control necesitas mantener?",
    options: [
      { v: "1", title: "Quiero ejecutar yo", sub: "Necesito que la IA sea un asistente que me entregue el resultado de una orden exacta y yo decido qué hacer después." },
      { v: "2", title: "Quiero que siga mi camino", sub: "Tengo un proceso claro y quiero que la IA corra automáticamente sobre pasos fijos que yo ya definí." },
      { v: "3", title: "Quiero que me proponga soluciones", sub: "Prefiero actuar como Director: yo pongo el objetivo y los límites, y la IA ejecuta los pasos complejos, pidiéndome aprobación en puntos clave." }
    ]
  }
];

const DIAG = {
  A: {
    profile: "Eres eficiencia directa.",
    title: "Tu diagnóstico: No necesitas un sistema complejo, necesitas optimizar Tareas.",
    desc: "Tu problema actual se resuelve dándole instrucciones directas y perfectas a la IA para eliminar la carga operativa diaria, manteniendo tú el control absoluto de cada resultado."
  },
  B: {
    profile: "Eres arquitecto de procesos.",
    title: "Tu diagnóstico: Tu problema requiere un Flujo de Trabajo (Workflow).",
    desc: "No te hace falta un agente que piense solo; lo que necesitas es conectar tus herramientas actuales para que los datos se muevan automáticamente en piloto automático siguiendo tus reglas fijas."
  },
  C: {
    profile: "Eres un delegador estratégico.",
    title: "Tu diagnóstico: Tu problema califica para un Agente de IA.",
    desc: "La complejidad de tu situación requiere delegar autonomía. Tu rol aquí es ser el Director Ejecutivo: pones las reglas del juego y los límites, y el Agente se encarga de procesar la incertidumbre y ejecutar los pasos complejos por ti."
  }
};

/* Regla de diagnóstico:
   - Control compartido (q2 = 3) o problema de complejidad (q1 = 3 o 4) → Agente (C).
   - Si no, el problema manda: operativo (q1 = 1) → Tareas (A); desorden (q1 = 2) → Flujo (B). */
function decide(a) {
  if (a.q2 === "3" || a.q1 === "3" || a.q1 === "4") return "C";
  if (a.q1 === "1") return "A";
  return "B";
}

const state = { step: 0, answers: {}, key: null, interest: "" };
const $ = (id) => document.getElementById(id);
const show = (id) => {
  for (const s of ["s0", "sq", "sr"]) $(s).hidden = s !== id;
  document.documentElement.classList.toggle("light", id === "s0");
  window.scrollTo({ top: 0, behavior: "auto" });
};

function renderQuestion(i) {
  const q = QUESTIONS[i];
  $("qtitle").textContent = q.text;
  $("bar").style.width = ((i + 0.5) / QUESTIONS.length * 100) + "%";
  const box = $("qopts");
  box.replaceChildren();
  for (const o of q.options) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "card";
    const s1 = document.createElement("strong"); s1.textContent = o.title;
    const s2 = document.createElement("span"); s2.textContent = o.sub;
    b.append(s1, s2);
    b.addEventListener("click", () => {
      state.answers[q.id] = o.v;
      if (i === QUESTIONS.length - 1) finish();
      else { state.step = i + 1; renderQuestion(state.step); }
    });
    box.append(b);
  }
}

function updateSave() {
  const p = new URLSearchParams({
    ruta: state.key,
    q1: state.answers.q1 || "",
    q2: state.answers.q2 || "",
    interes: state.interest
  });
  $("save").href = TALLY_URL + "?" + p.toString();
}

function finish() {
  state.key = decide(state.answers);
  const d = DIAG[state.key];
  $("rtitle").textContent = d.title;
  $("rdesc").textContent = d.desc;
  $("rprofile").textContent = d.profile;
  $("ititle").textContent = "¿Te interesa aprender a construir e implementar tú mismo la solución a este problema?";
  state.interest = "";
  for (const c of document.querySelectorAll("#sr .card")) c.setAttribute("aria-pressed", "false");
  updateSave();
  show("sr");
}

for (const c of document.querySelectorAll("#sr .card")) {
  c.addEventListener("click", () => {
    state.interest = c.dataset.i;
    for (const x of document.querySelectorAll("#sr .card")) x.setAttribute("aria-pressed", x === c ? "true" : "false");
    updateSave();
  });
}

$("start").addEventListener("click", () => {
  state.step = 0; state.answers = {}; state.key = null; state.interest = "";
  renderQuestion(0); show("sq");
});
$("back").addEventListener("click", () => {
  if (state.step === 0) show("s0");
  else { state.step -= 1; renderQuestion(state.step); }
});
$("change").addEventListener("click", () => { state.step = 0; state.answers = {}; renderQuestion(0); show("sq"); });
$("again").addEventListener("click", () => { state.step = 0; state.answers = {}; state.key = null; state.interest = ""; show("s0"); });
</script>
</body>
</html>
