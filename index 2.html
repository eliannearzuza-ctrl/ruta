<style>
  :root{color-scheme:light}
  html,body{margin:0;background:#FBFAF7}
  .wrap{position:relative;width:100%;max-width:430px;margin:0 auto}
  .wrap img{display:block;width:100%;height:auto}
  .hit{position:absolute;left:17%;top:17%;width:66%;height:66%;display:block;border-radius:16px}
.pulse{position:absolute;left:50%;top:50.4%;width:90%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(95,122,92,.6);pointer-events:none;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.96);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.08);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.6}}
  .hit:focus-visible{outline:2px solid #5F7A5C;outline-offset:3px}
</style>
</head>
<body>
<main class="wrap">
  <img src="cover.jpg" alt="Libera tu tiempo. Toca el reloj de arena para descubrir tu ruta con IA.">
  <span class="pulse" aria-hidden="true"></span>
  <a class="hit" href="https://claude.ai/artifact/NG9ur9hq5yLBSJzrSqk9ta" aria-label="Toca el reloj de arena: abrir la ruta"></a>
</main>
</body>
</html>
